# Spring Application Name
spring.application.name=clinic-appointment

# Server Configuration
server.port=1229

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:8080/clinic_db
spring.datasource.username=clinic
spring.datasource.password=Clinic@123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA (Hibernate) Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging level
logging.level.root=info
logging.level.com.soprasteria.clinic.appointment=debug

logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# Output directory
logging.file.name=logs/cliniclog.log

# Rolling policy (if you don't use XML config)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=500MB

jwt.expiration.ms=3600000

# Enable specific endpoints
management.endpoints.web.exposure.include=health,info

# Optionally, customize a base path
management.endpoints.web.base-path=/actuator

# Show full health details
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Enable actuator endpoints in Springdoc
springdoc.show-actuator=true
